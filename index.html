<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4efe5" id="theme-color" />
  <title>北京时间</title>
  <script>
    (() => {
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      let savedTheme = null;
      let savedNumerals = null;
      let savedClockOnly = null;
      try {
        savedTheme = localStorage.getItem('clock-theme');
        savedNumerals = localStorage.getItem('clock-numerals');
        savedClockOnly = localStorage.getItem('clock-only');
      } catch {}
      document.documentElement.dataset.theme =
        savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : systemPrefersDark ? 'dark' : 'light';
      document.documentElement.dataset.numerals = savedNumerals === 'full' ? 'full' : 'quarter';
      document.documentElement.dataset.clockOnly = savedClockOnly === 'true' ? 'true' : 'false';
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --ink: #1f2a30;
      --muted: #718087;
      --accent: #d85e45;
      --paper: #fffdf8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 18%, rgba(255, 255, 255, .95) 0 7%, transparent 26%),
        radial-gradient(circle at 83% 78%, rgba(209, 223, 216, .75), transparent 27%),
        linear-gradient(145deg, #f7f2e8 0%, #e8eee9 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 22rem;
      height: 22rem;
      border: 1px solid rgba(31, 42, 48, .08);
      border-radius: 50%;
      pointer-events: none;
    }

    body::before { top: -11rem; right: -7rem; }
    body::after { bottom: -14rem; left: -6rem; width: 30rem; height: 30rem; }

    main {
      width: min(92vw, 43rem);
      display: grid;
      justify-items: center;
      gap: clamp(1.25rem, 4vh, 2.25rem);
      padding: 2rem 1rem;
    }

    .heading { text-align: center; }

    .eyebrow {
      margin: 0 0 .45rem;
      color: var(--accent);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(1.85rem, 6vw, 2.75rem);
      font-weight: 500;
      letter-spacing: .16em;
    }

    .clock {
      position: relative;
      width: min(85vh, 80vh, 35rem);
      aspect-ratio: 1;
      border: clamp(8px, 1.5vw, 13px) solid var(--paper);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, transparent 0 62%, rgba(31, 42, 48, .025) 62.4% 63%, transparent 63.4%),
        var(--paper);
      box-shadow:
        0 1.6rem 3.2rem rgba(54, 66, 65, .16),
        inset 0 0 0 1px rgba(31, 42, 48, .08),
        inset 0 0 2rem rgba(31, 42, 48, .035);
    }

    .tick {
      position: absolute;
      inset: 3.4%;
      transform: rotate(calc(var(--index) * 6deg));
    }

    .tick::before {
      content: "";
      display: block;
      width: 1px;
      height: 2.2%;
      margin-inline: auto;
      background: #9da6a7;
    }

    .tick.major::before {
      width: 2px;
      height: 4.5%;
      background: var(--ink);
    }

    .numeral {
      position: absolute;
      z-index: 1;
      transform: translate(-50%, -50%);
      font-family: Georgia, serif;
      font-size: clamp(.9rem, 4vw, 1.55rem);
      font-variant-numeric: lining-nums;
    }

    .numeral--extra { display: none; }
    :root[data-numerals="full"] .numeral--extra { display: inline; }
    :root[data-clock-only="true"] .readout { display: none; }

    :root[data-clock-only="true"] .clock {
      width: min(90vh, 90vh, 50rem);
    }

    .brand {
      position: absolute;
      top: 29%;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: clamp(.48rem, 1.6vw, .65rem);
      font-weight: 700;
      letter-spacing: .2em;
      white-space: nowrap;
    }

    .hand {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 50%;
      border-radius: 999px;
      transform: translateX(-50%) rotate(0deg);
      transform-origin: 50% 100%;
      will-change: transform;
    }

    .hour {
      width: clamp(10px, 1.5vw, 10px);
      height: 25%;
      background: var(--ink);
    }

    .minute {
      width: clamp(5px, 1vw, 5px);
      height: 33%;
      background: var(--ink);
    }

    .second {
      z-index: 4;
      width: 2px;
      height: 44.0%;
      background: var(--accent);
    }

    .second::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      width: 2px;
      height: 12%;
      transform: translateX(-50%);
      background: var(--accent);
    }

    .pin {
      position: absolute;
      z-index: 5;
      top: 50%;
      left: 50%;
      width: clamp(12px, 3vw, 17px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border: 3px solid var(--paper);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 1px 4px rgba(31, 42, 48, .3);
    }

    .readout { text-align: center; }

    .digital {
      margin: 0;
      font-size: clamp(1.45rem, 5vw, 2.1rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: .1em;
    }

    .date {
      margin: .45rem 0 0;
      color: var(--muted);
      font-size: clamp(.82rem, 2.7vw, 1rem);
      letter-spacing: .08em;
    }

    .zone {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      margin-top: .75rem;
      padding: .34rem .7rem;
      border: 1px solid rgba(31, 42, 48, .1);
      border-radius: 999px;
      color: #536268;
      background: rgba(255, 255, 255, .42);
      font-size: .7rem;
      letter-spacing: .08em;
    }

    .zone::before {
      content: "";
      width: .4rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #5c9b79;
      box-shadow: 0 0 0 3px rgba(92, 155, 121, .12);
    }

    .controls {
      position: fixed;
      z-index: 10;
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(1rem, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0;
    }

    .control-button {
      width: 2.8rem;
      height: 2.8rem;
      flex: 0 0 2.8rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid rgba(31, 42, 48, .13);
      border-radius: 50%;
      color: var(--ink);
      background: rgba(255, 255, 255, .52);
      box-shadow: 0 .5rem 1.5rem rgba(54, 66, 65, .1);
      font: inherit;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: color .25s ease, background-color .25s ease, border-color .25s ease, transform .2s ease;
    }

    .control-button:hover { transform: translateY(-2px); }

    .control-button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 3px;
    }

    .settings-toggle { order: 1; }

    .settings-icon {
      font-size: 1.2rem;
      line-height: 1;
      transition: transform .35s ease;
    }

    .control-option {
      width: 0;
      flex-basis: 0;
      margin-right: 0;
      overflow: hidden;
      border-width: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(.8rem) scale(.82);
      transition:
        width .3s ease,
        flex-basis .3s ease,
        margin-right .3s ease,
        opacity .2s ease,
        visibility 0s linear .3s,
        transform .3s ease,
        color .25s ease,
        background-color .25s ease,
        border-color .25s ease;
    }

    .controls:hover .control-option,
    .controls.is-expanded .control-option,
    .controls:has(.control-button:focus-visible) .control-option {
      width: 2.8rem;
      flex-basis: 2.8rem;
      margin-right: .55rem;
      border-width: 1px;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(0) scale(1);
      transition-delay: 0s;
    }

    .controls:hover .settings-icon,
    .controls.is-expanded .settings-icon,
    .controls:has(.control-button:focus-visible) .settings-icon {
      transform: rotate(60deg);
    }

    .mode-toggle[aria-pressed="true"] {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent);
    }

    .control-icon {
      font-size: 1.05rem;
      line-height: 1;
    }

    .theme-icon {
      font-size: 1.25rem;
      line-height: 1;
      transition: transform .3s ease;
    }

    .countdown-toggle { position: relative; }

    .countdown-toggle.is-active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .countdown-toggle.is-active::after {
      content: "";
      position: absolute;
      top: .2rem;
      right: .2rem;
      width: .45rem;
      aspect-ratio: 1;
      border: 2px solid var(--paper);
      border-radius: 50%;
      background: var(--accent);
    }

    .countdown-panel {
      position: fixed;
      z-index: 20;
      right: max(1rem, env(safe-area-inset-right));
      bottom: calc(max(1rem, env(safe-area-inset-bottom)) + 3.6rem);
      width: min(calc(100vw - 2rem), 23rem);
      padding: 1.15rem;
      border: 1px solid rgba(31, 42, 48, .13);
      border-radius: 1.25rem;
      color: var(--ink);
      background: color-mix(in srgb, var(--paper) 92%, transparent);
      box-shadow: 0 1.2rem 3rem rgba(54, 66, 65, .2);
      backdrop-filter: blur(18px);
    }

    .countdown-panel[hidden] { display: none; }

    .countdown-panel.is-finished {
      border-color: var(--accent);
      box-shadow: 0 1.2rem 3rem rgba(54, 66, 65, .2), 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .countdown-header,
    .countdown-notification,
    .countdown-actions {
      display: flex;
      align-items: center;
    }

    .countdown-header { justify-content: space-between; }

    .countdown-title {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: .08em;
    }

    .countdown-close {
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
      font: inherit;
      font-size: 1.25rem;
      cursor: pointer;
    }

    .countdown-close:hover { background: rgba(31, 42, 48, .07); }

    .countdown-display {
      display: block;
      margin: .75rem 0 .2rem;
      font-size: clamp(2rem, 11vw, 3.1rem);
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: .06em;
      text-align: center;
    }

    .countdown-status {
      min-height: 1.3em;
      margin: 0 0 .9rem;
      color: var(--muted);
      font-size: .76rem;
      line-height: 1.4;
      text-align: center;
    }

    .countdown-status[data-state="error"] { color: var(--accent); }

    .countdown-form { display: grid; gap: .8rem; }

    .countdown-label {
      display: grid;
      gap: .35rem;
      color: var(--muted);
      font-size: .72rem;
    }

    .countdown-input,
    .duration-input {
      width: 100%;
      border: 1px solid rgba(31, 42, 48, .14);
      border-radius: .7rem;
      color: var(--ink);
      background: rgba(255, 255, 255, .48);
      font: inherit;
      outline: none;
    }

    .countdown-input {
      height: 2.5rem;
      padding: 0 .75rem;
    }

    .countdown-input:focus,
    .duration-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
    }

    .duration-fields {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .55rem;
    }

    .duration-field {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: .25rem;
      color: var(--muted);
      font-size: .72rem;
    }

    .duration-input {
      min-width: 0;
      height: 2.5rem;
      padding: 0 .35rem 0 .65rem;
      font-variant-numeric: tabular-nums;
    }

    .countdown-actions { gap: .55rem; }

    .countdown-action {
      min-height: 2.5rem;
      flex: 1;
      padding: .55rem .8rem;
      border: 1px solid transparent;
      border-radius: .75rem;
      font: inherit;
      font-size: .82rem;
      font-weight: 650;
      cursor: pointer;
    }

    .countdown-action:disabled { cursor: default; opacity: .5; }

    .countdown-primary {
      color: #fff;
      background: var(--accent);
    }

    .countdown-secondary {
      border-color: rgba(31, 42, 48, .13);
      color: var(--ink);
      background: transparent;
    }

    .countdown-notification {
      justify-content: space-between;
      gap: .75rem;
      margin-top: .9rem;
      padding-top: .85rem;
      border-top: 1px solid rgba(31, 42, 48, .09);
    }

    .notification-status {
      color: var(--muted);
      font-size: .7rem;
      line-height: 1.35;
    }

    .notification-button {
      flex: 0 0 auto;
      min-height: 2rem;
      padding: .35rem .65rem;
      font-size: .72rem;
    }

    :root[data-theme="light"] .theme-icon::before { content: "☾"; }
    :root[data-theme="dark"] .theme-icon::before { content: "☀"; }
    :root[data-theme="dark"] .theme-icon { transform: rotate(90deg); }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #eef3f0;
      --muted: #a2afac;
      --accent: #ff8068;
      --paper: #192223;
    }

    :root[data-theme="dark"] body {
      background:
        radial-gradient(circle at 20% 18%, rgba(63, 79, 77, .42) 0 7%, transparent 26%),
        radial-gradient(circle at 83% 78%, rgba(38, 67, 61, .48), transparent 27%),
        linear-gradient(145deg, #111718 0%, #17201f 100%);
    }

    :root[data-theme="dark"] body::before,
    :root[data-theme="dark"] body::after {
      border-color: rgba(221, 235, 229, .08);
    }

    :root[data-theme="dark"] .clock {
      background:
        radial-gradient(circle at 50% 50%, transparent 0 62%, rgba(255, 255, 255, .035) 62.4% 63%, transparent 63.4%),
        var(--paper);
      box-shadow:
        0 1.6rem 3.2rem rgba(0, 0, 0, .38),
        inset 0 0 0 1px rgba(255, 255, 255, .06),
        inset 0 0 2rem rgba(0, 0, 0, .18);
    }

    :root[data-theme="dark"] .tick::before { background: #667473; }
    :root[data-theme="dark"] .tick.major::before { background: var(--ink); }

    :root[data-theme="dark"] .zone {
      border-color: rgba(238, 243, 240, .1);
      color: #b6c2bf;
      background: rgba(255, 255, 255, .045);
    }

    :root[data-theme="dark"] .control-button {
      border-color: rgba(238, 243, 240, .12);
      background: rgba(25, 34, 35, .72);
      box-shadow: 0 .5rem 1.5rem rgba(0, 0, 0, .24);
    }

    :root[data-theme="dark"] .mode-toggle[aria-pressed="true"] {
      border-color: var(--accent);
      color: #192223;
      background: var(--accent);
    }

    :root[data-theme="dark"] .countdown-panel {
      border-color: rgba(238, 243, 240, .12);
      background: rgba(25, 34, 35, .9);
      box-shadow: 0 1.2rem 3rem rgba(0, 0, 0, .4);
    }

    :root[data-theme="dark"] .countdown-input,
    :root[data-theme="dark"] .duration-input {
      border-color: rgba(238, 243, 240, .13);
      background: rgba(255, 255, 255, .055);
    }

    :root[data-theme="dark"] .countdown-secondary {
      border-color: rgba(238, 243, 240, .13);
    }

    :root[data-theme="dark"] .countdown-close:hover { background: rgba(255, 255, 255, .07); }
    :root[data-theme="dark"] .countdown-notification { border-top-color: rgba(238, 243, 240, .09); }

    body, .clock, .zone { transition: color .3s ease, background .3s ease, border-color .3s ease, box-shadow .3s ease; }

    @media (max-height: 650px) {
      main { gap: .8rem; padding-block: .8rem; }
      .clock { width: min(75vw, 70vh, 30rem); }
      .zone { margin-top: .4rem; }
    }

    @media (max-width: 480px) {
      .countdown-panel {
        right: max(.65rem, env(safe-area-inset-right));
        bottom: calc(max(.65rem, env(safe-area-inset-bottom)) + 3.6rem);
        width: calc(100vw - 1.3rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hand { will-change: auto; }
      .control-option, .settings-icon { transition: none; }
    }
  </style>
</head>
<body>
  <div class="controls" id="controls" role="group" aria-label="时钟显示设置">
    <button class="control-button settings-toggle" id="settings-toggle" type="button" aria-label="展开设置" aria-expanded="false" aria-controls="countdown-toggle numeral-toggle clock-only-toggle theme-toggle" title="设置">
      <span class="settings-icon" aria-hidden="true">⚙︎</span>
    </button>
    <button class="control-button control-option countdown-toggle" id="countdown-toggle" type="button" aria-label="打开倒计时" aria-expanded="false" aria-controls="countdown-panel" title="倒计时">
      <span class="control-icon" aria-hidden="true">⏳</span>
    </button>
    <button class="control-button control-option mode-toggle" id="numeral-toggle" type="button" aria-label="显示完整数字刻度" aria-pressed="false" title="显示完整数字刻度">
      <span class="control-icon" aria-hidden="true">⑫</span>
    </button>
    <button class="control-button control-option mode-toggle" id="clock-only-toggle" type="button" aria-label="仅显示钟表" aria-pressed="false" title="仅显示钟表">
      <span class="control-icon" aria-hidden="true">◷</span>
    </button>
    <button class="control-button control-option theme-toggle" id="theme-toggle" type="button" aria-label="切换到暗色主题" title="切换到暗色主题">
      <span class="theme-icon" aria-hidden="true"></span>
    </button>
  </div>

  <aside class="countdown-panel" id="countdown-panel" role="dialog" aria-labelledby="countdown-heading" hidden>
    <div class="countdown-header">
      <h2 class="countdown-title" id="countdown-heading">倒计时</h2>
      <button class="countdown-close" id="countdown-close" type="button" aria-label="关闭倒计时面板">×</button>
    </div>
    <output class="countdown-display" id="countdown-display" aria-live="off">00:05:00</output>
    <p class="countdown-status" id="countdown-status" aria-live="polite">设置时长后开始</p>
    <form class="countdown-form" id="countdown-form">
      <label class="countdown-label" for="countdown-label">
        提醒事项
        <input class="countdown-input" id="countdown-label" name="label" type="text" maxlength="40" placeholder="例如：休息结束" autocomplete="off" />
      </label>
      <div class="duration-fields" aria-label="倒计时时长">
        <label class="duration-field">
          <input class="duration-input" id="countdown-hours" name="hours" type="number" min="0" max="99" value="0" inputmode="numeric" aria-label="小时" />
          <span>时</span>
        </label>
        <label class="duration-field">
          <input class="duration-input" id="countdown-minutes" name="minutes" type="number" min="0" max="59" value="5" inputmode="numeric" aria-label="分钟" />
          <span>分</span>
        </label>
        <label class="duration-field">
          <input class="duration-input" id="countdown-seconds" name="seconds" type="number" min="0" max="59" value="0" inputmode="numeric" aria-label="秒" />
          <span>秒</span>
        </label>
      </div>
      <div class="countdown-actions">
        <button class="countdown-action countdown-primary" type="submit">开始倒计时</button>
        <button class="countdown-action countdown-secondary" id="countdown-cancel" type="button" disabled>取消</button>
      </div>
    </form>
    <div class="countdown-notification">
      <span class="notification-status" id="notification-status">正在检查通知权限…</span>
      <button class="countdown-action countdown-secondary notification-button" id="notification-enable" type="button">启用通知</button>
    </div>
  </aside>

  <main>
    <section class="clock" aria-label="北京时间模拟时钟">
      <div id="ticks" aria-hidden="true"></div>
      <div class="numerals" aria-hidden="true">
        <span class="numeral" style="left:50%;top:12%">12</span>
        <span class="numeral numeral--extra" style="left:69%;top:17%">1</span>
        <span class="numeral numeral--extra" style="left:83%;top:31%">2</span>
        <span class="numeral" style="left:88%;top:50%">3</span>
        <span class="numeral numeral--extra" style="left:83%;top:69%">4</span>
        <span class="numeral numeral--extra" style="left:69%;top:83%">5</span>
        <span class="numeral" style="left:50%;top:88%">6</span>
        <span class="numeral numeral--extra" style="left:31%;top:83%">7</span>
        <span class="numeral numeral--extra" style="left:17%;top:69%">8</span>
        <span class="numeral" style="left:12%;top:50%">9</span>
        <span class="numeral numeral--extra" style="left:17%;top:31%">10</span>
        <span class="numeral numeral--extra" style="left:31%;top:17%">11</span>
      </div>
      <span class="brand">BEIJING · UTC+8</span>
      <span class="hand hour" id="hour-hand"></span>
      <span class="hand minute" id="minute-hand"></span>
      <span class="hand second" id="second-hand"></span>
      <span class="pin"></span>
    </section>

    <section class="readout" aria-live="off">
      <p class="digital" id="digital-time">00:00:00</p>
      <p class="date" id="date-text">正在同步北京时间…</p>
      <span class="zone">Asia / Shanghai</span>
    </section>
  </main>

  <script>
    const ticks = document.querySelector('#ticks');
    const hourHand = document.querySelector('#hour-hand');
    const minuteHand = document.querySelector('#minute-hand');
    const secondHand = document.querySelector('#second-hand');
    const digitalTime = document.querySelector('#digital-time');
    const dateText = document.querySelector('#date-text');
    const controls = document.querySelector('#controls');
    const settingsToggle = document.querySelector('#settings-toggle');
    const countdownToggle = document.querySelector('#countdown-toggle');
    const countdownPanel = document.querySelector('#countdown-panel');
    const countdownClose = document.querySelector('#countdown-close');
    const countdownDisplay = document.querySelector('#countdown-display');
    const countdownStatus = document.querySelector('#countdown-status');
    const countdownForm = document.querySelector('#countdown-form');
    const countdownLabel = document.querySelector('#countdown-label');
    const countdownHours = document.querySelector('#countdown-hours');
    const countdownMinutes = document.querySelector('#countdown-minutes');
    const countdownSeconds = document.querySelector('#countdown-seconds');
    const countdownCancel = document.querySelector('#countdown-cancel');
    const notificationStatus = document.querySelector('#notification-status');
    const notificationEnable = document.querySelector('#notification-enable');
    const numeralToggle = document.querySelector('#numeral-toggle');
    const clockOnlyToggle = document.querySelector('#clock-only-toggle');
    const themeToggle = document.querySelector('#theme-toggle');
    const themeColor = document.querySelector('#theme-color');
    const colorScheme = window.matchMedia('(prefers-color-scheme: dark)');

    function syncControlsExpanded() {
      const expanded = controls.matches(':hover') ||
        controls.classList.contains('is-expanded') ||
        controls.matches(':has(.control-button:focus-visible)');
      settingsToggle.setAttribute('aria-expanded', String(expanded));
      settingsToggle.setAttribute('aria-label', expanded ? '收起设置' : '展开设置');
    }

    const scheduleControlsSync = () => requestAnimationFrame(syncControlsExpanded);

    controls.addEventListener('pointerenter', scheduleControlsSync);
    controls.addEventListener('pointerleave', () => {
      controls.classList.remove('is-expanded');
      scheduleControlsSync();
    });
    controls.addEventListener('focusin', scheduleControlsSync);
    controls.addEventListener('focusout', scheduleControlsSync);

    settingsToggle.addEventListener('click', () => {
      controls.classList.toggle('is-expanded');
      syncControlsExpanded();
    });

    controls.addEventListener('click', event => {
      if (event.target.closest('.control-option')) {
        controls.classList.remove('is-expanded');
        scheduleControlsSync();
      }
    });

    document.addEventListener('pointerdown', event => {
      if (!controls.contains(event.target)) {
        controls.classList.remove('is-expanded');
        scheduleControlsSync();
      }
      if (!countdownPanel.hidden && !countdownPanel.contains(event.target) && !countdownToggle.contains(event.target)) {
        setCountdownPanelOpen(false);
      }
    });

    function getSavedTheme() {
      try { return localStorage.getItem('clock-theme'); } catch { return null; }
    }

    function applyTheme(theme) {
      const isDark = theme === 'dark';
      document.documentElement.dataset.theme = theme;
      themeToggle.setAttribute('aria-label', isDark ? '切换到浅色主题' : '切换到暗色主题');
      themeToggle.title = isDark ? '切换到浅色主题' : '切换到暗色主题';
      themeColor.content = isDark ? '#111718' : '#f4efe5';
    }

    function applyNumeralMode(mode) {
      const isFull = mode === 'full';
      const actionLabel = isFull ? '切换为四个数字刻度' : '显示完整数字刻度';
      document.documentElement.dataset.numerals = isFull ? 'full' : 'quarter';
      numeralToggle.setAttribute('aria-pressed', String(isFull));
      numeralToggle.setAttribute('aria-label', actionLabel);
      numeralToggle.title = actionLabel;
    }

    function applyClockOnly(enabled) {
      const actionLabel = enabled ? '显示时间、日期和时区' : '仅显示钟表';
      document.documentElement.dataset.clockOnly = String(enabled);
      clockOnlyToggle.setAttribute('aria-pressed', String(enabled));
      clockOnlyToggle.setAttribute('aria-label', actionLabel);
      clockOnlyToggle.title = actionLabel;
    }

    applyTheme(document.documentElement.dataset.theme);
    applyNumeralMode(document.documentElement.dataset.numerals);
    applyClockOnly(document.documentElement.dataset.clockOnly === 'true');

    numeralToggle.addEventListener('click', () => {
      const nextMode = document.documentElement.dataset.numerals === 'full' ? 'quarter' : 'full';
      applyNumeralMode(nextMode);
      try { localStorage.setItem('clock-numerals', nextMode); } catch {}
    });

    clockOnlyToggle.addEventListener('click', () => {
      const nextEnabled = document.documentElement.dataset.clockOnly !== 'true';
      applyClockOnly(nextEnabled);
      try { localStorage.setItem('clock-only', String(nextEnabled)); } catch {}
    });

    themeToggle.addEventListener('click', () => {
      const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(nextTheme);
      try { localStorage.setItem('clock-theme', nextTheme); } catch {}
    });

    colorScheme.addEventListener('change', event => {
      if (!getSavedTheme()) applyTheme(event.matches ? 'dark' : 'light');
    });

    const COUNTDOWN_STORAGE_KEY = 'clock-countdown';
    let countdownState = loadCountdownState();
    let countdownWorker = null;
    let countdownFallbackTimer = null;

    function setCountdownPanelOpen(open) {
      countdownPanel.hidden = !open;
      countdownToggle.setAttribute('aria-expanded', String(open));
      countdownToggle.setAttribute('aria-label', open ? '关闭倒计时' : '打开倒计时');
      if (open) countdownLabel.focus({ preventScroll: true });
    }

    function formatCountdown(milliseconds) {
      const totalSeconds = Math.max(0, Math.ceil(milliseconds / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const pad = value => String(value).padStart(2, '0');
      return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    function getInputDuration() {
      const hours = Number(countdownHours.value);
      const minutes = Number(countdownMinutes.value);
      const seconds = Number(countdownSeconds.value);
      if (![hours, minutes, seconds].every(Number.isFinite)) return 0;
      if (hours < 0 || hours > 99 || minutes < 0 || minutes > 59 || seconds < 0 || seconds > 59) return 0;
      return Math.floor((hours * 3600 + minutes * 60 + seconds) * 1000);
    }

    function loadCountdownState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(COUNTDOWN_STORAGE_KEY));
        if (parsed && Number.isFinite(parsed.endTime) && parsed.endTime > 0) {
          return {
            endTime: parsed.endTime,
            duration: Number.isFinite(parsed.duration) ? parsed.duration : 0,
            label: typeof parsed.label === 'string' ? parsed.label.slice(0, 40) : ''
          };
        }
      } catch {}
      return null;
    }

    function saveCountdownState() {
      try {
        if (countdownState) localStorage.setItem(COUNTDOWN_STORAGE_KEY, JSON.stringify(countdownState));
        else localStorage.removeItem(COUNTDOWN_STORAGE_KEY);
      } catch {}
    }

    function stopCountdownTicker() {
      if (countdownWorker) {
        countdownWorker.terminate();
        countdownWorker = null;
      }
      if (countdownFallbackTimer !== null) {
        clearInterval(countdownFallbackTimer);
        countdownFallbackTimer = null;
      }
    }

    function startCountdownTicker() {
      stopCountdownTicker();
      try {
        const source = `
          let timer = null;
          self.onmessage = event => {
            if (event.data === 'start') {
              clearInterval(timer);
              self.postMessage(Date.now());
              timer = setInterval(() => self.postMessage(Date.now()), 500);
            }
          };
        `;
        const workerUrl = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
        countdownWorker = new Worker(workerUrl);
        URL.revokeObjectURL(workerUrl);
        countdownWorker.onmessage = syncCountdown;
        countdownWorker.onerror = () => {
          stopCountdownTicker();
          countdownFallbackTimer = setInterval(syncCountdown, 500);
        };
        countdownWorker.postMessage('start');
      } catch {
        countdownFallbackTimer = setInterval(syncCountdown, 500);
      }
    }

    function renderCountdown(milliseconds) {
      countdownDisplay.textContent = formatCountdown(milliseconds);
      countdownToggle.classList.toggle('is-active', Boolean(countdownState));
      countdownCancel.disabled = !countdownState;
      if (countdownState) {
        const endText = new Date(countdownState.endTime).toLocaleTimeString('zh-CN', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        countdownStatus.dataset.state = '';
        countdownStatus.textContent = `${countdownState.label || '倒计时'} · 预计 ${endText} 结束`;
      }
    }

    function showCountdownNotification(label) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      try {
        const notification = new Notification(label || '倒计时结束', {
          body: '设定的时间已经到了。',
          tag: 'beijing-clock-countdown',
          renotify: true
        });
        notification.onclick = () => {
          window.focus();
          setCountdownPanelOpen(true);
          notification.close();
        };
      } catch {}
    }

    function finishCountdown() {
      if (!countdownState) return;
      const finishedLabel = countdownState.label || '倒计时结束';
      countdownState = null;
      saveCountdownState();
      stopCountdownTicker();
      countdownDisplay.textContent = '00:00:00';
      countdownStatus.dataset.state = 'error';
      countdownStatus.textContent = `${finishedLabel}：时间到！`;
      countdownToggle.classList.remove('is-active');
      countdownCancel.disabled = true;
      countdownPanel.classList.add('is-finished');
      showCountdownNotification(finishedLabel);
    }

    function syncCountdown() {
      if (!countdownState) return;
      const remaining = countdownState.endTime - Date.now();
      if (remaining <= 0) finishCountdown();
      else renderCountdown(remaining);
    }

    function updateNotificationStatus() {
      if (!('Notification' in window)) {
        notificationStatus.textContent = '当前浏览器不支持系统通知';
        notificationEnable.hidden = true;
        return;
      }
      notificationEnable.hidden = false;
      if (Notification.permission === 'granted') {
        notificationStatus.textContent = '系统通知已启用';
        notificationEnable.textContent = '已启用';
        notificationEnable.disabled = true;
      } else if (Notification.permission === 'denied') {
        notificationStatus.textContent = '通知已被拒绝，请在浏览器网站设置中开启';
        notificationEnable.textContent = '已拒绝';
        notificationEnable.disabled = true;
      } else {
        notificationStatus.textContent = '启用后，后台标签页到时会发送通知';
        notificationEnable.textContent = '启用通知';
        notificationEnable.disabled = false;
      }
    }

    countdownToggle.addEventListener('click', () => {
      setCountdownPanelOpen(countdownPanel.hidden);
    });

    countdownClose.addEventListener('click', () => setCountdownPanelOpen(false));

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !countdownPanel.hidden) setCountdownPanelOpen(false);
    });

    countdownForm.addEventListener('input', () => {
      if (!countdownState) {
        countdownDisplay.textContent = formatCountdown(getInputDuration());
        countdownStatus.dataset.state = '';
        countdownStatus.textContent = '设置时长后开始';
        countdownPanel.classList.remove('is-finished');
      }
    });

    countdownForm.addEventListener('submit', event => {
      event.preventDefault();
      const duration = getInputDuration();
      if (duration <= 0) {
        countdownStatus.dataset.state = 'error';
        countdownStatus.textContent = '请输入 1 秒以上的有效时长';
        return;
      }
      countdownState = {
        endTime: Date.now() + duration,
        duration,
        label: countdownLabel.value.trim().slice(0, 40)
      };
      countdownPanel.classList.remove('is-finished');
      saveCountdownState();
      renderCountdown(duration);
      startCountdownTicker();
    });

    countdownCancel.addEventListener('click', () => {
      countdownState = null;
      saveCountdownState();
      stopCountdownTicker();
      countdownDisplay.textContent = formatCountdown(getInputDuration());
      countdownStatus.dataset.state = '';
      countdownStatus.textContent = '倒计时已取消';
      countdownToggle.classList.remove('is-active');
      countdownCancel.disabled = true;
      countdownPanel.classList.remove('is-finished');
    });

    notificationEnable.addEventListener('click', async () => {
      if (!('Notification' in window) || Notification.permission !== 'default') return;
      try { await Notification.requestPermission(); } catch {}
      updateNotificationStatus();
    });

    document.addEventListener('visibilitychange', syncCountdown);
    window.addEventListener('focus', syncCountdown);

    updateNotificationStatus();
    if (countdownState) {
      countdownLabel.value = countdownState.label;
      if (countdownState.endTime <= Date.now()) finishCountdown();
      else {
        renderCountdown(countdownState.endTime - Date.now());
        startCountdownTicker();
      }
    } else {
      countdownDisplay.textContent = formatCountdown(getInputDuration());
    }

    const tickFragment = document.createDocumentFragment();
    for (let index = 0; index < 60; index += 1) {
      const tick = document.createElement('i');
      tick.className = `tick${index % 5 === 0 ? ' major' : ''}`;
      tick.style.setProperty('--index', index);
      tickFragment.appendChild(tick);
    }
    ticks.appendChild(tickFragment);

    const dateFormatter = new Intl.DateTimeFormat('zh-CN', {
      timeZone: 'Asia/Shanghai',
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      weekday: 'long'
    });

    const lunarFormatter = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', {
      timeZone: 'Asia/Shanghai',
      month: 'long',
      day: 'numeric'
    });

    function formatLunarDay(day) {
      const numerals = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
      if (day < 10) return `初${numerals[day]}`;
      if (day === 10) return '初十';
      if (day < 20) return `十${numerals[day - 10]}`;
      if (day === 20) return '二十';
      if (day < 30) return `廿${numerals[day - 20]}`;
      return '三十';
    }

    function formatLunarDate(date) {
      const parts = lunarFormatter.formatToParts(date);
      const month = parts.find(part => part.type === 'month')?.value;
      const day = Number(parts.find(part => part.type === 'day')?.value);

      if (!month || !Number.isInteger(day)) return `农历${lunarFormatter.format(date)}`;
      return `农历${month}${formatLunarDay(day)}`;
    }

    let lastSecond = -1;

    function updateClock() {
      const now = new Date();
      // 将当前时间映射到 UTC+8，再使用 UTC getter，避免访客本地时区影响。
      const beijing = new Date(now.getTime() + 8 * 60 * 60 * 1000);
      const milliseconds = beijing.getUTCMilliseconds();
      const seconds = beijing.getUTCSeconds() + milliseconds / 1000;
      const minutes = beijing.getUTCMinutes() + seconds / 60;
      const hours = (beijing.getUTCHours() % 12) + minutes / 60;

      hourHand.style.transform = `translateX(-50%) rotate(${hours * 30}deg)`;
      minuteHand.style.transform = `translateX(-50%) rotate(${minutes * 6}deg)`;
      secondHand.style.transform = `translateX(-50%) rotate(${seconds * 6}deg)`;

      const wholeSecond = beijing.getUTCSeconds();
      if (wholeSecond !== lastSecond) {
        lastSecond = wholeSecond;
        const pad = value => String(value).padStart(2, '0');
        digitalTime.textContent = `${pad(beijing.getUTCHours())}:${pad(beijing.getUTCMinutes())}:${pad(wholeSecond)}`;
        dateText.textContent = `${dateFormatter.format(now)} · ${formatLunarDate(now)}`;
        document.title = `${digitalTime.textContent} · 北京时间`;
      }

      requestAnimationFrame(updateClock);
    }

    updateClock();
  </script>
</body>
</html>
