<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4efe5" id="theme-color" />
  <title>北京时间</title>
  <script>
    (() => {
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      let savedTheme = null;
      try { savedTheme = localStorage.getItem('clock-theme'); } catch {}
      document.documentElement.dataset.theme =
        savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : systemPrefersDark ? 'dark' : 'light';
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --ink: #1f2a30;
      --muted: #718087;
      --accent: #d85e45;
      --paper: #fffdf8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 18%, rgba(255, 255, 255, .95) 0 7%, transparent 26%),
        radial-gradient(circle at 83% 78%, rgba(209, 223, 216, .75), transparent 27%),
        linear-gradient(145deg, #f7f2e8 0%, #e8eee9 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 22rem;
      height: 22rem;
      border: 1px solid rgba(31, 42, 48, .08);
      border-radius: 50%;
      pointer-events: none;
    }

    body::before { top: -11rem; right: -7rem; }
    body::after { bottom: -14rem; left: -6rem; width: 30rem; height: 30rem; }

    main {
      width: min(92vw, 43rem);
      display: grid;
      justify-items: center;
      gap: clamp(1.25rem, 4vh, 2.25rem);
      padding: 2rem 1rem;
    }

    .heading { text-align: center; }

    .eyebrow {
      margin: 0 0 .45rem;
      color: var(--accent);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(1.85rem, 6vw, 2.75rem);
      font-weight: 500;
      letter-spacing: .16em;
    }

    .clock {
      position: relative;
      width: min(72vw, 48vh, 25rem);
      aspect-ratio: 1;
      border: clamp(8px, 1.5vw, 13px) solid var(--paper);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, transparent 0 62%, rgba(31, 42, 48, .025) 62.4% 63%, transparent 63.4%),
        var(--paper);
      box-shadow:
        0 1.6rem 3.2rem rgba(54, 66, 65, .16),
        inset 0 0 0 1px rgba(31, 42, 48, .08),
        inset 0 0 2rem rgba(31, 42, 48, .035);
    }

    .tick {
      position: absolute;
      inset: 3.4%;
      transform: rotate(calc(var(--index) * 6deg));
    }

    .tick::before {
      content: "";
      display: block;
      width: 1px;
      height: 2.2%;
      margin-inline: auto;
      background: #9da6a7;
    }

    .tick.major::before {
      width: 2px;
      height: 4.5%;
      background: var(--ink);
    }

    .numeral {
      position: absolute;
      z-index: 1;
      transform: translate(-50%, -50%);
      font-family: Georgia, serif;
      font-size: clamp(.9rem, 4vw, 1.55rem);
      font-variant-numeric: lining-nums;
    }

    .brand {
      position: absolute;
      top: 29%;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: clamp(.48rem, 1.6vw, .65rem);
      font-weight: 700;
      letter-spacing: .2em;
      white-space: nowrap;
    }

    .hand {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 50%;
      border-radius: 999px;
      transform: translateX(-50%) rotate(0deg);
      transform-origin: 50% 100%;
      will-change: transform;
    }

    .hour {
      width: clamp(5px, 1.5vw, 8px);
      height: 25%;
      background: var(--ink);
    }

    .minute {
      width: clamp(3px, 1vw, 5px);
      height: 35%;
      background: var(--ink);
    }

    .second {
      z-index: 4;
      width: 2px;
      height: 39%;
      background: var(--accent);
    }

    .second::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      width: 2px;
      height: 12%;
      transform: translateX(-50%);
      background: var(--accent);
    }

    .pin {
      position: absolute;
      z-index: 5;
      top: 50%;
      left: 50%;
      width: clamp(12px, 3vw, 17px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border: 3px solid var(--paper);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 1px 4px rgba(31, 42, 48, .3);
    }

    .readout { text-align: center; }

    .digital {
      margin: 0;
      font-size: clamp(1.45rem, 5vw, 2.1rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: .1em;
    }

    .date {
      margin: .45rem 0 0;
      color: var(--muted);
      font-size: clamp(.82rem, 2.7vw, 1rem);
      letter-spacing: .08em;
    }

    .zone {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      margin-top: .75rem;
      padding: .34rem .7rem;
      border: 1px solid rgba(31, 42, 48, .1);
      border-radius: 999px;
      color: #536268;
      background: rgba(255, 255, 255, .42);
      font-size: .7rem;
      letter-spacing: .08em;
    }

    .zone::before {
      content: "";
      width: .4rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #5c9b79;
      box-shadow: 0 0 0 3px rgba(92, 155, 121, .12);
    }

    .theme-toggle {
      position: fixed;
      z-index: 10;
      top: max(1rem, env(safe-area-inset-top));
      right: max(1rem, env(safe-area-inset-right));
      width: 2.8rem;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(31, 42, 48, .13);
      border-radius: 50%;
      color: var(--ink);
      background: rgba(255, 255, 255, .52);
      box-shadow: 0 .5rem 1.5rem rgba(54, 66, 65, .1);
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: color .25s ease, background-color .25s ease, border-color .25s ease, transform .2s ease;
    }

    .theme-toggle:hover { transform: translateY(-2px); }

    .theme-toggle:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 3px;
    }

    .theme-icon {
      font-size: 1.25rem;
      line-height: 1;
      transition: transform .3s ease;
    }

    :root[data-theme="light"] .theme-icon::before { content: "☾"; }
    :root[data-theme="dark"] .theme-icon::before { content: "☀"; }
    :root[data-theme="dark"] .theme-icon { transform: rotate(90deg); }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #eef3f0;
      --muted: #a2afac;
      --accent: #ff8068;
      --paper: #192223;
    }

    :root[data-theme="dark"] body {
      background:
        radial-gradient(circle at 20% 18%, rgba(63, 79, 77, .42) 0 7%, transparent 26%),
        radial-gradient(circle at 83% 78%, rgba(38, 67, 61, .48), transparent 27%),
        linear-gradient(145deg, #111718 0%, #17201f 100%);
    }

    :root[data-theme="dark"] body::before,
    :root[data-theme="dark"] body::after {
      border-color: rgba(221, 235, 229, .08);
    }

    :root[data-theme="dark"] .clock {
      background:
        radial-gradient(circle at 50% 50%, transparent 0 62%, rgba(255, 255, 255, .035) 62.4% 63%, transparent 63.4%),
        var(--paper);
      box-shadow:
        0 1.6rem 3.2rem rgba(0, 0, 0, .38),
        inset 0 0 0 1px rgba(255, 255, 255, .06),
        inset 0 0 2rem rgba(0, 0, 0, .18);
    }

    :root[data-theme="dark"] .tick::before { background: #667473; }
    :root[data-theme="dark"] .tick.major::before { background: var(--ink); }

    :root[data-theme="dark"] .zone {
      border-color: rgba(238, 243, 240, .1);
      color: #b6c2bf;
      background: rgba(255, 255, 255, .045);
    }

    :root[data-theme="dark"] .theme-toggle {
      border-color: rgba(238, 243, 240, .12);
      background: rgba(25, 34, 35, .72);
      box-shadow: 0 .5rem 1.5rem rgba(0, 0, 0, .24);
    }

    body, .clock, .zone { transition: color .3s ease, background .3s ease, border-color .3s ease, box-shadow .3s ease; }

    @media (max-height: 650px) {
      main { gap: .8rem; padding-block: .8rem; }
      .clock { width: min(58vw, 52vh, 20rem); }
      .zone { margin-top: .4rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hand { will-change: auto; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换到暗色主题" title="切换到暗色主题">
    <span class="theme-icon" aria-hidden="true"></span>
  </button>

  <main>
    <section class="clock" style="width: min(86vw, 66vh, 31rem)" aria-label="北京时间模拟时钟">
      <div id="ticks" aria-hidden="true"></div>
      <span class="numeral" style="left:50%;top:12%">12</span>
      <span class="numeral" style="left:88%;top:50%">3</span>
      <span class="numeral" style="left:50%;top:88%">6</span>
      <span class="numeral" style="left:12%;top:50%">9</span>
      <span class="brand">BEIJING · UTC+8</span>
      <span class="hand hour" id="hour-hand"></span>
      <span class="hand minute" id="minute-hand"></span>
      <span class="hand second" id="second-hand"></span>
      <span class="pin"></span>
    </section>

    <section class="readout" aria-live="off">
      <p class="digital" id="digital-time">00:00:00</p>
      <p class="date" id="date-text">正在同步北京时间…</p>
      <span class="zone">Asia / Shanghai</span>
    </section>
  </main>

  <script>
    const ticks = document.querySelector('#ticks');
    const hourHand = document.querySelector('#hour-hand');
    const minuteHand = document.querySelector('#minute-hand');
    const secondHand = document.querySelector('#second-hand');
    const digitalTime = document.querySelector('#digital-time');
    const dateText = document.querySelector('#date-text');
    const themeToggle = document.querySelector('#theme-toggle');
    const themeColor = document.querySelector('#theme-color');
    const colorScheme = window.matchMedia('(prefers-color-scheme: dark)');

    function getSavedTheme() {
      try { return localStorage.getItem('clock-theme'); } catch { return null; }
    }

    function applyTheme(theme) {
      const isDark = theme === 'dark';
      document.documentElement.dataset.theme = theme;
      themeToggle.setAttribute('aria-label', isDark ? '切换到浅色主题' : '切换到暗色主题');
      themeToggle.title = isDark ? '切换到浅色主题' : '切换到暗色主题';
      themeColor.content = isDark ? '#111718' : '#f4efe5';
    }

    applyTheme(document.documentElement.dataset.theme);

    themeToggle.addEventListener('click', () => {
      const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(nextTheme);
      try { localStorage.setItem('clock-theme', nextTheme); } catch {}
    });

    colorScheme.addEventListener('change', event => {
      if (!getSavedTheme()) applyTheme(event.matches ? 'dark' : 'light');
    });

    const tickFragment = document.createDocumentFragment();
    for (let index = 0; index < 60; index += 1) {
      const tick = document.createElement('i');
      tick.className = `tick${index % 5 === 0 ? ' major' : ''}`;
      tick.style.setProperty('--index', index);
      tickFragment.appendChild(tick);
    }
    ticks.appendChild(tickFragment);

    const dateFormatter = new Intl.DateTimeFormat('zh-CN', {
      timeZone: 'Asia/Shanghai',
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      weekday: 'long'
    });

    const lunarFormatter = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', {
      timeZone: 'Asia/Shanghai',
      month: 'long',
      day: 'numeric'
    });

    function formatLunarDay(day) {
      const numerals = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
      if (day < 10) return `初${numerals[day]}`;
      if (day === 10) return '初十';
      if (day < 20) return `十${numerals[day - 10]}`;
      if (day === 20) return '二十';
      if (day < 30) return `廿${numerals[day - 20]}`;
      return '三十';
    }

    function formatLunarDate(date) {
      const parts = lunarFormatter.formatToParts(date);
      const month = parts.find(part => part.type === 'month')?.value;
      const day = Number(parts.find(part => part.type === 'day')?.value);

      if (!month || !Number.isInteger(day)) return `农历${lunarFormatter.format(date)}`;
      return `农历${month}${formatLunarDay(day)}`;
    }

    let lastSecond = -1;

    function updateClock() {
      const now = new Date();
      // 将当前时间映射到 UTC+8，再使用 UTC getter，避免访客本地时区影响。
      const beijing = new Date(now.getTime() + 8 * 60 * 60 * 1000);
      const milliseconds = beijing.getUTCMilliseconds();
      const seconds = beijing.getUTCSeconds() + milliseconds / 1000;
      const minutes = beijing.getUTCMinutes() + seconds / 60;
      const hours = (beijing.getUTCHours() % 12) + minutes / 60;

      hourHand.style.transform = `translateX(-50%) rotate(${hours * 30}deg)`;
      minuteHand.style.transform = `translateX(-50%) rotate(${minutes * 6}deg)`;
      secondHand.style.transform = `translateX(-50%) rotate(${seconds * 6}deg)`;

      const wholeSecond = beijing.getUTCSeconds();
      if (wholeSecond !== lastSecond) {
        lastSecond = wholeSecond;
        const pad = value => String(value).padStart(2, '0');
        digitalTime.textContent = `${pad(beijing.getUTCHours())}:${pad(beijing.getUTCMinutes())}:${pad(wholeSecond)}`;
        dateText.textContent = `${dateFormatter.format(now)} · ${formatLunarDate(now)}`;
        document.title = `${digitalTime.textContent} · 北京时间`;
      }

      requestAnimationFrame(updateClock);
    }

    updateClock();
  </script>
</body>
</html>
